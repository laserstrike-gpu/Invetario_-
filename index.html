<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sistema de Ventas</h1>

    <h2>Inventario</h2>

    <input type="text" id="inputNombre" placeholder="Nombre">

    <input type="text" id="inputCategoria" placeholder="Categoria">

    <input type="number" id="inputPrecio" placeholder="Precio">

    <input type="number" id="inputStock" placeholder="Stock">

    <button id="botonAgregar">Agregar producto</button>
    <button id="botonEliminar">Eliminar producto</button>
    <button id="botonEditar">Editar Producto</button>

    <input type="text" id="inputBuscar" placeholder="Buscar">

    <div id="listaProductos"></div>

    <script src="app.js"></script>
</body>
</html>
